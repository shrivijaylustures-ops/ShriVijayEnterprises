# Builds "SVE Website Editor.exe" for Windows whenever the editor changes.
# Download it from the Actions tab: open the latest run, then "Artifacts" > SVE-Website-Editor.
name: Build website editor

on:
  push:
    branches: [redesign, main]
    paths:
      - 'editor/**'
      - '.github/workflows/build-editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip -r editor/requirements.txt pyinstaller

      - name: Self-test from source (key encryption, photos, server)
        working-directory: editor
        run: python main.py --self-test --config-dir "$env:RUNNER_TEMP\sve-selftest"

      - name: Build the .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "SVE Website Editor"
          --icon editor/icon.ico
          --add-data "editor/ui;ui"
          --paths editor
          editor/main.py

      - name: Self-test the built .exe
        run: |
          $p = Start-Process -FilePath "dist\SVE Website Editor.exe" -ArgumentList '--self-test', '--config-dir', "$env:RUNNER_TEMP\sve-exe-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\sve-exe-test\editor.log" -ErrorAction SilentlyContinue; exit 1 }
          Write-Host "exe self-test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: SVE-Website-Editor
          path: dist/SVE Website Editor.exe
          retention-days: 90
