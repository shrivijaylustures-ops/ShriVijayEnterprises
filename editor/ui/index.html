<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fffdf9" />
    <title>SVE Website Editor</title>
    <link rel="icon" href="emblem.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- First-time setup (Kartik) -->
    <main id="setup" class="setup" hidden>
      <form class="setup-card" id="setupForm" novalidate>
        <img src="emblem.svg" alt="" width="56" height="56" />
        <h1>Set up the website editor</h1>
        <p class="muted">This step is for Kartik. It connects the editor to the website once; after that it opens straight into the editor.</p>

        <label class="field">
          <span>GitHub key</span>
          <input name="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" />
          <small id="tokenHint">A fine-grained personal access token for the website repository, with Contents: Read and write.</small>
        </label>
        <button type="button" class="link" data-open="https://github.com/settings/personal-access-tokens/new">Create a key on GitHub</button>

        <details class="advanced">
          <summary>Website settings</summary>
          <label class="field"><span>Repository</span><input name="repo" autocomplete="off" spellcheck="false" /></label>
          <label class="field"><span>Branch</span><input name="branch" autocomplete="off" spellcheck="false" /></label>
          <label class="field"><span>Website address</span><input name="site_url" type="url" autocomplete="off" spellcheck="false" /></label>
        </details>

        <p class="form-error" id="setupError" role="alert" hidden></p>
        <div class="setup-actions">
          <button class="btn primary big" type="submit">Check and save</button>
          <button class="btn" type="button" id="setupBack" hidden>Back to the editor</button>
          <button class="btn danger-text" type="button" id="setupForget" hidden>Remove the key from this computer</button>
        </div>
      </form>
    </main>

    <!-- The editor -->
    <div id="app" class="app" hidden>
      <header class="top">
        <div class="brand">
          <img src="emblem.svg" alt="" width="36" height="36" />
          <div>
            <strong>Website editor</strong>
            <span translate="no"><span lang="hi">श्री</span> Vijay Enterprises</span>
          </div>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">Loading the website…</p>
        <div class="top-actions">
          <button class="btn" id="undoAll" type="button" hidden>Undo all<span class="wide-only"> changes</span></button>
          <button class="btn primary" id="publishBtn" type="button" disabled>Publish<span class="wide-only"> changes</span> <span class="publish-count" id="publishCount"></span></button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings (for Kartik)" title="Settings (for Kartik)">
            <svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M128 80a48 48 0 1 0 48 48 48.05 48.05 0 0 0-48-48Zm0 80a32 32 0 1 1 32-32 32 32 0 0 1-32 32Zm88-29.84q.06-2.16 0-4.32l14.92-18.64a8 8 0 0 0 1.48-7.06 107.21 107.21 0 0 0-10.88-26.25 8 8 0 0 0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186 40.54a8 8 0 0 0-3.94-6 107.71 107.71 0 0 0-26.25-10.87 8 8 0 0 0-7.06 1.49L130.16 40q-2.16-.06-4.32 0L107.2 25.11a8 8 0 0 0-7.06-1.48 107.6 107.6 0 0 0-26.25 10.88 8 8 0 0 0-3.93 6l-2.64 23.76q-1.56 1.49-3 3L40.54 70a8 8 0 0 0-6 3.94 107.71 107.71 0 0 0-10.87 26.25 8 8 0 0 0 1.49 7.06L40 125.84q-.06 2.16 0 4.32L25.11 148.8a8 8 0 0 0-1.48 7.06 107.21 107.21 0 0 0 10.88 26.25 8 8 0 0 0 6 3.93l23.72 2.64q1.49 1.56 3 3L70 215.46a8 8 0 0 0 3.94 6 107.71 107.71 0 0 0 26.25 10.87 8 8 0 0 0 7.06-1.49L125.84 216q2.16.06 4.32 0l18.64 14.92a8 8 0 0 0 7.06 1.48 107.21 107.21 0 0 0 26.25-10.88 8 8 0 0 0 3.93-6l2.64-23.72q1.56-1.48 3-3l23.78-2.8a8 8 0 0 0 6-3.94 107.71 107.71 0 0 0 10.87-26.25 8 8 0 0 0-1.49-7.06Zm-16.1-6.5a73.93 73.93 0 0 1 0 8.68 8 8 0 0 0 1.74 5.48l14.19 17.73a91.57 91.57 0 0 1-6.23 15l-22.6 2.56a8 8 0 0 0-5.1 2.64 74.11 74.11 0 0 1-6.14 6.14 8 8 0 0 0-2.64 5.1l-2.51 22.58a91.32 91.32 0 0 1-15 6.23l-17.74-14.19a8 8 0 0 0-5-1.75h-.48a73.93 73.93 0 0 1-8.68 0 8 8 0 0 0-5.48 1.74l-17.78 14.2a91.57 91.57 0 0 1-15-6.23L82.89 187a8 8 0 0 0-2.64-5.1 74.11 74.11 0 0 1-6.14-6.14 8 8 0 0 0-5.1-2.64l-22.58-2.52a91.32 91.32 0 0 1-6.23-15l14.19-17.74a8 8 0 0 0 1.74-5.48 73.93 73.93 0 0 1 0-8.68 8 8 0 0 0-1.74-5.48L40.2 100.45a91.57 91.57 0 0 1 6.23-15L69 82.89a8 8 0 0 0 5.1-2.64 74.11 74.11 0 0 1 6.14-6.14A8 8 0 0 0 82.89 69l2.51-22.57a91.32 91.32 0 0 1 15-6.23l17.74 14.19a8 8 0 0 0 5.48 1.74 73.93 73.93 0 0 1 8.68 0 8 8 0 0 0 5.48-1.74l17.77-14.19a91.57 91.57 0 0 1 15 6.23L173.11 69a8 8 0 0 0 2.64 5.1 74.11 74.11 0 0 1 6.14 6.14 8 8 0 0 0 5.1 2.64l22.58 2.51a91.32 91.32 0 0 1 6.23 15l-14.19 17.74a8 8 0 0 0-1.74 5.53Z"/></svg>
          </button>
        </div>
      </header>

      <p class="practice-bar">Practice mode: nothing you do here changes the website. <a href="./">Leave practice mode</a></p>
      <button class="side-toggle" id="sideToggle" type="button" aria-expanded="false" aria-controls="side">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path fill="currentColor" d="M224 128a8 8 0 0 1-8 8H40a8 8 0 0 1 0-16h176a8 8 0 0 1 8 8ZM40 72h176a8 8 0 0 0 0-16H40a8 8 0 0 0 0 16Zm176 112H40a8 8 0 0 0 0 16h176a8 8 0 0 0 0-16Z"/></svg>
        <span class="side-toggle-text"><small>Menu</small><span id="sideToggleLabel">Loading…</span></span>
      </button>
      <nav class="side" id="side" aria-label="Sections"></nav>
      <main class="main" id="main" tabindex="-1"></main>
    </div>

    <!-- Add or edit one item -->
    <dialog class="panel" id="panel" aria-labelledby="panelTitle"></dialog>

    <!-- Publish -->
    <dialog class="modal" id="publishDialog" aria-labelledby="publishTitle"></dialog>

    <!-- Yes/no questions -->
    <dialog class="modal small" id="confirmDialog" aria-labelledby="confirmTitle">
      <form method="dialog">
        <h2 id="confirmTitle"></h2>
        <p id="confirmText"></p>
        <div class="modal-actions">
          <button class="btn" value="no" id="confirmNo">Cancel</button>
          <button class="btn primary" value="yes" id="confirmYes">Yes</button>
        </div>
      </form>
    </dialog>

    <!-- Type a name (groups) -->
    <dialog class="modal small" id="askDialog" aria-labelledby="askTitle">
      <form id="askForm" novalidate>
        <h2 id="askTitle"></h2>
        <label class="field"><span id="askLabel"></span><input id="askInput" maxlength="60" autocomplete="off" /><small id="askHelp"></small></label>
        <p class="field-error" id="askError" role="alert" hidden></p>
        <div class="modal-actions">
          <button class="btn" value="no" type="submit" formnovalidate>Cancel</button>
          <button class="btn primary" value="yes" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toastText"></span>
      <button class="btn small" id="toastAction" type="button" hidden></button>
    </div>

    <script src="backend.js"></script>
    <script src="app.js"></script>
  </body>
</html>
